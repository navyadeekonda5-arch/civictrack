{% extends "base.html" %}
{% block content %}
<div class="col-md-5 mx-auto card p-4">
  <h4>Login</h4>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Login</button>
  </form>
  <p class="mt-3">New here? <a href="{% url 'signup' %}">Create an account</a></p>
</div>
{% endblock %}
